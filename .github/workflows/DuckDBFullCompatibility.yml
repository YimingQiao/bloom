name: DuckDB Full Compatibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bloom mode to exercise across the DuckDB test suite
        required: true
        default: both
        type: choice
        options:
          - both
          - disabled
          - enabled

permissions:
  contents: read

concurrency:
  group: duckdb-full-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-test:
    name: Full DuckDB suite (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_DIR: build/fulltest
      BLOOM_SAMPLE_CACHE_DIR: ${{ github.workspace }}/build/fulltest-bloom-samples

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Check compatibility comparison logic
        run: python3 -m unittest discover --start-directory test/python -p test_compare_compatibility.py

      - name: Configure DuckDB full-test runner
        run: |
          cmake \
            -G Ninja \
            -S duckdb \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXPLICIT_VERSION=v2.0.0 \
            -DEXTENSION_STATIC_BUILD=1 \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/extension_config.cmake" \
            -DBUILD_EXTENSIONS='core_functions;parquet;tpch;tpcds' \
            -DLINK_CORE_EXTENSIONS=ON \
            -DBUILD_UNITTESTS=TRUE \
            -DENABLE_UNITTEST_CPP_TESTS=TRUE \
            -DUNITTEST_ROOT_DIRECTORY="$GITHUB_WORKSPACE/duckdb" \
            -DDUCKDB_CAPABILITIES='httplib;loadable_extensions'

      - name: Build DuckDB and Bloom
        run: cmake --build "$BUILD_DIR" --target all --parallel 2

      - name: Check lineage invariants and extension tests
        run: |
          c++ -std=c++17 -O0 \
            -I src/include -I duckdb/src/include -I duckdb/third_party/fmt/include \
            test/cpp/key_lineage_test.cpp \
            src/predicate_transfer/transfer_plan/lineage_tracker.cpp \
            -L "$BUILD_DIR/src" -Wl,-rpath,"$GITHUB_WORKSPACE/$BUILD_DIR/src" -lduckdb \
            -o "$BUILD_DIR/key_lineage_test"
          "$BUILD_DIR/key_lineage_test"
          "$BUILD_DIR/test/unittest" --test-dir "$GITHUB_WORKSPACE" 'test/sql/*'

      - name: Check sample filter estimates
        env:
          BLOOM_TEST_DUCKDB: ${{ github.workspace }}/build/fulltest/duckdb
        run: python3 -m unittest discover --start-directory test/python -p test_sample_filters.py

      - name: Verify full test discovery
        id: discovery
        run: |
          status=0
          "$BUILD_DIR/test/unittest" --list-tests '*' > "$RUNNER_TEMP/duckdb-tests.tsv" || status=$?
          # Catch returns the number of listed tests; the TSV has one header row.
          count=$(( $(wc -l < "$RUNNER_TEMP/duckdb-tests.tsv") - 1 ))
          test "$count" -gt 1000
          test "$status" -eq "$((count % 256))"

      - name: Run full suite with Bloom loaded and Bloom disabled
        id: disabled
        shell: bash
        if: inputs.mode == 'both' || inputs.mode == 'disabled'
        env:
          BLOOM_ENABLE: "0"
        run: |
          status=0
          python3 duckdb/scripts/ci/run_tests.py \
            --workers 4 \
            --max-retries 0 \
            --batch-timeout 600 \
            --test-config "$GITHUB_WORKSPACE/test/configs/duckdb_full_bloom_disabled.json" \
            "$BUILD_DIR/test/unittest" \
            '*' 2>&1 | tee "$RUNNER_TEMP/duckdb-disabled.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ '${{ inputs.mode }}' != 'both' ]; then exit "$status"; fi

      - name: Run full suite with Bloom enabled
        id: enabled
        shell: bash
        if: ${{ !cancelled() && steps.discovery.outcome == 'success' && (inputs.mode == 'both' || inputs.mode == 'enabled') }}
        env:
          BLOOM_ENABLE: "1"
        run: |
          status=0
          python3 duckdb/scripts/ci/run_tests.py \
            --workers 4 \
            --max-retries 0 \
            --batch-timeout 600 \
            --test-config "$GITHUB_WORKSPACE/test/configs/duckdb_full_bloom_enabled.json" \
            "$BUILD_DIR/test/unittest" \
            '*' 2>&1 | tee "$RUNNER_TEMP/duckdb-enabled.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ '${{ inputs.mode }}' != 'both' ]; then exit "$status"; fi

      - name: Compare full-suite results
        if: inputs.mode == 'both'
        run: |
          python3 scripts/compare_compatibility.py \
            --disabled-log "$RUNNER_TEMP/duckdb-disabled.log" \
            --disabled-exit '${{ steps.disabled.outputs.exit_code }}' \
            --enabled-log "$RUNNER_TEMP/duckdb-enabled.log" \
            --enabled-exit '${{ steps.enabled.outputs.exit_code }}'

      - name: Upload compatibility logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duckdb-full-compatibility-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/duckdb-tests.tsv
            ${{ runner.temp }}/duckdb-disabled.log
            ${{ runner.temp }}/duckdb-enabled.log
          retention-days: 7
