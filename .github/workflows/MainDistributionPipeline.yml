#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  duckdb-stable-build:
    name: Build DuckDB 2.0.0 binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@2de802913caf5c9bba0ef267658b20f3cc0486c3
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: 2de802913caf5c9bba0ef267658b20f3cc0486c3
      extension_name: bloom

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@2de802913caf5c9bba0ef267658b20f3cc0486c3
    with:
      ci_tools_version: 2de802913caf5c9bba0ef267658b20f3cc0486c3
      extension_name: bloom
      format_checks: 'format;tidy'
